name: Build Discipline APK
on:
  push:
    branches: [main]
    paths:
      - "weekly-planner/source.zip"
      - ".github/workflows/build-flutter-apk.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Extract source
        run: |
          mkdir -p /tmp/discipline
          unzip -oq weekly-planner/source.zip -d /tmp/discipline
          mkdir -p flutter-project
          cp -a /tmp/discipline/weekly-planner-flutter/. flutter-project/
      - name: Set app name
        working-directory: flutter-project
        run: |
          sed -i 's/^name: weekly_planner$/name: discipline/' pubspec.yaml
          sed -i 's/برنامه هفتگی/Discipline/g' tool/patch_android.py
          sed -i "s/title: 'برنامه هفتگی'/title: 'Discipline'/" lib/main.dart
      - name: Generate Android platform
        working-directory: flutter-project
        run: flutter create --platforms=android --org com.discipline --project-name discipline .
      - name: Patch Android settings
        working-directory: flutter-project
        run: python3 tool/patch_android.py
      - name: Get dependencies
        working-directory: flutter-project
        run: flutter pub get
      - name: Build release APK
        working-directory: flutter-project
        run: flutter build apk --release --no-shrink
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: discipline-apk
          path: flutter-project/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
