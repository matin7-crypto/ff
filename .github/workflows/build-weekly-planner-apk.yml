name: Build Discipline APK

on:
  push:
    branches: [main]
    paths:
      - "weekly-planner/source.zip"
      - ".github/workflows/build-weekly-planner-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Extract Flutter project
        run: |
          mkdir -p /tmp/discipline
          unzip -oq weekly-planner/source.zip -d /tmp/discipline
          cp -R /tmp/discipline/weekly-planner-flutter/. .
      - name: Set app name
        run: |
          sed -i 's/^name: weekly_planner$/name: discipline/' pubspec.yaml
          sed -i 's/برنامه هفتگی/Discipline/g' tool/patch_android.py
          sed -i "s/title: 'برنامه هفتگی'/title: 'Discipline'/" lib/main.dart
      - name: Generate Android project
        run: flutter create --platforms=android --org com.discipline --project-name discipline .
      - name: Patch Android settings
        run: python3 tool/patch_android.py
      - name: Get packages
        run: flutter pub get
      - name: Build release APK
        run: flutter build apk --release --no-shrink
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: discipline-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
