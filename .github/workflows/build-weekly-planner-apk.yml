name: Build Weekly Planner APK

on:
  push:
    branches: [main]
    paths:
      - "weekly-planner/**"
      - ".github/workflows/build-weekly-planner-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract project
        run: |
          mkdir -p weekly-planner
          unzip -oq weekly-planner/source.zip -d /tmp/weekly-planner
          cp -R /tmp/weekly-planner/planner-app/. weekly-planner/
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies and Android platform
        working-directory: weekly-planner
        run: |
          npm install
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        working-directory: weekly-planner/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: weekly-planner-apk
          path: weekly-planner/android/app/build/outputs/apk/debug/app-debug.apk
